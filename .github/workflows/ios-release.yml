name: iPhone 배포 정보 갱신

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [ios.json]

permissions:
  contents: write

concurrency:
  group: public-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/ios_release.py
        env:
          GH_TOKEN: ${{ github.token }}
